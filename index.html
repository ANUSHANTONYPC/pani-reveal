<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANI Reveal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:radial-gradient(circle at center,#3b0000 0%,#1a0000 100%);
}

/* START PAGE */
.start-screen{
    position:absolute;
    inset:0;
    background:url('download.jpg') center center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:opacity .8s ease, visibility .8s ease;
}

.start-screen::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(to top, rgba(20,0,0,.85) 0%, rgba(20,0,0,.35) 55%, rgba(0,0,0,.65) 100%);
    backdrop-filter:blur(2px);
}

.start-screen.hide{
    opacity:0;
    visibility:hidden;
}

/* ENTER BUTTON */
.start-btn{
    position:relative;
    z-index:2;
    padding:16px 50px;
    border:none;
    border-radius:60px;
    background:linear-gradient(135deg,#f7df94 0%, #d4a93a 55%, #b98518 100%);
    color:#2a0000;
    font-size:17px;
    font-weight:600;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:
        0 10px 30px rgba(212,169,58,.35),
        inset 0 1px 1px rgba(255,255,255,.45);
    transition:all .35s ease;
}

.start-btn:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:
        0 18px 45px rgba(212,169,58,.55),
        0 0 30px rgba(245,211,122,.35);
}

.start-btn:active{
    transform:scale(.98);
}

/* FOOTER IMAGE */
.footer-img{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(760px,95%);
    z-index:2;
    pointer-events:none;
    opacity:.96;
    filter:
        drop-shadow(0 -10px 35px rgba(0,0,0,.65));
    animation:peopleRise 1.4s ease forwards;
}

@keyframes peopleRise{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(40px);
    }
    to{
        opacity:.96;
        transform:translateX(-50%) translateY(0);
    }
}

/* PRELOADER */
.loader-wrap{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at center,#3b0000 0%,#1a0000 100%);
    z-index:20;
}

.handle-preloader{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.spinner{
    width:62px;
    height:62px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.08);
    border-top:3px solid #d4a93a;
    animation:spin .9s linear infinite;
    margin-bottom:28px;
    box-shadow:0 0 18px rgba(212,169,58,.25);
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.txt-loading{
    display:flex;
    gap:10px;
}

.letters-loading{
    font-size:42px;
    font-weight:700;
    color:#e7c56c;
    opacity:0;
    text-shadow:0 0 12px rgba(212,169,58,.5);
    animation:letterAnim 1.4s infinite;
}

.letters-loading:nth-child(1){ animation-delay:0s; }
.letters-loading:nth-child(2){ animation-delay:.15s; }
.letters-loading:nth-child(3){ animation-delay:.3s; }
.letters-loading:nth-child(4){ animation-delay:.45s; }

@keyframes letterAnim{
    0%{
        opacity:0;
        transform:translateY(10px);
    }
    50%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:0;
        transform:translateY(-10px);
    }
}

/* LOGO SCREEN */
.logo-screen{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at center,#220000 0%,#050000 70%,#000000 100%);
    overflow:hidden;
    z-index:30;
}

.logo-screen::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle, rgba(212,169,58,.12), transparent 70%);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.logo-img{
    position:relative;
    z-index:2;
    width:min(550px,80%);
    opacity:0;
    transform:scale(.88);
    animation:logoReveal 1.8s ease forwards;
    /* filter:drop-shadow(0 0 30px rgba(212,169,58,.35)); */
}

@keyframes logoReveal{
    0%{
        opacity:0;
        transform:scale(.88);
    }
    60%{
        opacity:1;
        transform:scale(1.03);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* LIGHT SWEEP */
.logo-img::after{
    content:"";
}

.logo-shine{
    position:absolute;
    width:180px;
    height:180%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );
    transform:rotate(25deg) translateX(-600px);
    animation:shine 2s ease 1.5s forwards;
    pointer-events:none;
}

@keyframes shine{
    to{
        transform:rotate(25deg) translateX(900px);
    }
}

/* RESPONSIVE */
@media(max-width:768px){
    .start-btn{
        padding:14px 40px;
        font-size:15px;
    }

    .letters-loading{
        font-size:34px;
    }

    .footer-img{
        width:95%;
    }

    .logo-img{
        width:88%;
    }
}
</style>
</head>
<body>

<!-- START PAGE -->
<div class="start-screen" id="startScreen">
    <button class="start-btn" onclick="startReveal()">Enter</button>

    <!-- Footer People Image -->
    <img src="people.png" class="footer-img" alt="People">
</div>

<!-- PRELOADER -->
<div class="loader-wrap" id="loader">
    <div class="handle-preloader">
        <div class="spinner"></div>

        <div class="txt-loading">
            <span class="letters-loading">P</span>
            <span class="letters-loading">A</span>
            <span class="letters-loading">N</span>
            <span class="letters-loading">I</span>
        </div>
    </div>
</div>

<!-- LOGO PAGE -->
<div class="logo-screen" id="logoScreen">
    <div class="logo-shine"></div>
    <img src="PANI.png" class="logo-img" alt="PANI Logo">
</div>

<script>
function startReveal(){
    const startScreen = document.getElementById('startScreen');
    const loader = document.getElementById('loader');
    const logoScreen = document.getElementById('logoScreen');

    startScreen.classList.add('hide');

    setTimeout(() => {
        loader.style.display = 'flex';
    }, 700);

    setTimeout(() => {
        loader.style.display = 'none';
        logoScreen.style.display = 'flex';
    }, 3200);
}
</script>

</body>
</html>
